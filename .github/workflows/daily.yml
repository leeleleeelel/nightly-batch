name: daily
on:
  schedule:
    - cron: "23 11 * * 1-5"   # 20:23 KST, Monday-Friday: the page is ready by about 21:00 (off the top of the hour, where GitHub delays or drops triggers)
    - cron: "41 12 * * 1-5"   # 21:41 KST backup in case the first trigger is dropped; does nothing when a page was built in the last 6 hours
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - name: restore last pages
        uses: actions/cache/restore@v4
        with:
          path: keep
          key: pages-${{ github.run_id }}
          restore-keys: pages-
      - name: already built?
        id: chk
        run: |
          now=$(date +%s); last=$(cat keep/.built_at 2>/dev/null | tr -cd '0-9'); last=${last:-0}
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( now - last )) -lt 21600 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "a page was built $(( (now - last) / 60 )) minutes ago - nothing to do"
          fi
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with:
          python-version: "3.14"
      - if: steps.chk.outputs.skip != '1'
        run: pip install -r requirements.txt
      - name: restore data
        if: steps.chk.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw_yh
            data/sec
            data/finra
            data/ftd
            data/th
            data/meta
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: seed (first run only)
        if: steps.chk.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_PATH: ${{ secrets.PAGE_PATH }}
        run: |
          mkdir -p data/ftd data/sec "site/$PAGE_PATH"
          if ! ls data/ftd/*.zip >/dev/null 2>&1; then gh release download seed-ftd --repo "${{ github.repository }}" -p seed_ftd.zip -D /tmp && unzip -q -o /tmp/seed_ftd.zip -d data/ftd && cp seed/ftd_fetch_log.csv data/ftd/ftd_fetch_log.csv; fi
          [ -f data/sec/cik_map.csv ] || cp seed/cik_map.csv data/sec/cik_map.csv
          if [ -n "$PAGE_PATH" ] && [ -d keep ]; then cp -a keep/. "site/$PAGE_PATH/"; fi
      - name: run
        id: run
        if: steps.chk.outputs.skip != '1'
        env:
          RALLY_BASE: ${{ github.workspace }}
          RALLY_DATA: ${{ github.workspace }}/data
          RALLY_OUT: ${{ github.workspace }}/site/${{ secrets.PAGE_PATH }}
          RALLY_LOGS: ${{ github.workspace }}/logs
          RALLY_NO_BROWSER: "1"
        run: python -X utf8 code/daily_run.py
      - name: save data
        if: always() && steps.chk.outputs.skip != '1'
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw_yh
            data/sec
            data/finra
            data/ftd
            data/th
            data/meta
          key: data-${{ github.run_id }}
      - name: site root
        if: always() && steps.chk.outputs.skip != '1'
        env:
          PAGE_PATH: ${{ secrets.PAGE_PATH }}
        run: |
          mkdir -p site
          printf '<!doctype html><meta charset="utf-8"><title>.</title>' > site/index.html
          rm -f site/*/scores_latest.pkl
          find site -mindepth 1 -maxdepth 1 -type d ! -name "$PAGE_PATH" -exec rm -rf {} +
          rm -rf keep && mkdir -p keep
          if [ -n "$PAGE_PATH" ] && [ -d "site/$PAGE_PATH" ]; then cp -a "site/$PAGE_PATH/." keep/; rm -f "site/$PAGE_PATH/.built_at"; fi
          if [ "${{ steps.run.outcome }}" = "success" ]; then date +%s > keep/.built_at; fi
      - name: save last pages
        if: always() && steps.chk.outputs.skip != '1'
        uses: actions/cache/save@v4
        with:
          path: keep
          key: pages-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.chk.outputs.skip != '1'
        with:
          path: site
          retention-days: 1
      - uses: actions/deploy-pages@v4
        if: always() && steps.chk.outputs.skip != '1'
  keepalive:
    # GitHub pauses scheduled workflows of a public repository after 60 days without repository activity.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: commit a heartbeat when the last commit is 45+ days old
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%MZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "keepalive" && git push
          else
            echo "last commit $(( (now - last) / 86400 )) days ago - nothing to do"
          fi
