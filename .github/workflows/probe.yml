name: probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install requests
      - name: SEC order test
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          python - <<'PY'
          import os, re, time, requests
          c = os.environ.get("SEC_CONTACT", "")
          gen = "rally-research-script/1.0 (personal research)"
          con = "rally-research-script/1.0 (personal research; contact %s)" % c
          con2 = "nightly-batch %s" % c
          steps = [("data", con, "https://data.sec.gov/submissions/CIK0000320193.json"),
                   ("data", gen, "https://data.sec.gov/submissions/CIK0000320193.json"),
                   ("data", con2, "https://data.sec.gov/submissions/CIK0000789019.json"),
                   ("www", con, "https://www.sec.gov/files/company_tickers.json"),
                   ("data", gen, "https://data.sec.gov/submissions/CIK0001045810.json"),
                   ("data", con, "https://data.sec.gov/submissions/CIK0001018724.json")]
          for i, (h, ua, u) in enumerate(steps):
              try:
                  r = requests.get(u, headers={"User-Agent": ua, "Accept-Encoding": "gzip, deflate"}, timeout=40)
                  kind = "gen" if ua == gen else ("con" if ua == con else "con2")
                  txt = "" if r.status_code == 200 else re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text))[:300]
                  print(i, h, kind, r.status_code, len(r.content), txt)
              except Exception as e:
                  print(i, h, "ERR", repr(e)[:100])
              time.sleep(2)
          PY
