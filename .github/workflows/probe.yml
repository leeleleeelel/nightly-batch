name: probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install requests
      - name: EDGAR entity search with the generic name
        run: |
          python - <<'PYX'
          import re, time, requests
          gen = "rally-research-script/1.0 (personal research)"
          for q in ["AAPL", "NCPL", "SLS", "HLP"]:
              try:
                  r = requests.get("https://efts.sec.gov/LATEST/search-index?keysTyped=" + q, headers={"User-Agent": gen, "Accept-Encoding": "gzip, deflate"}, timeout=40)
                  txt = "" if r.status_code == 200 else re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text))[:120]
                  hits = []
                  if r.status_code == 200:
                      for h in r.json().get("hits", {}).get("hits", [])[:3]: hits.append((h.get("_id"), str(h.get("_source", {}).get("tickers", ""))[:30]))
                  print("efts", q, r.status_code, len(r.content), hits, txt)
              except Exception as e:
                  print("efts", q, "ERR", repr(e)[:100])
              time.sleep(1.5)
          PYX
